<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>זמינות מדריכים טכנודע</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3e8ff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        #root {
            width: 100%;
            max-width: 450px;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #d8b4fe;
            border-radius: 10px;
        }
        @keyframes bounce-in {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        .animate-bounce-in {
            animation: bounce-in 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root">טוען את המערכת...</div>

    <script type="text/babel">
        const { useState, useRef } = React;

        const App = () => {
            const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxU2-YLy34dR8oJ95fzLhanzPmaMc48DTIaa_PwGA_v1pRKQqdakZKe9fz3KNq0H1ZYaQ/exec"; 
            const logoUrl = "https://drive.google.com/thumbnail?id=124NTOwyrBjzCz7UXAdXChqmK-yJ-9NGQ&sz=w800";
            
            const initialState = {
                firstName: '',
                lastName: '',
                phone: '',
                availability: {}
            };

            const [step, setStep] = useState('welcome');
            const [formData, setFormData] = useState(initialState);
            const [errors, setErrors] = useState({});
            const [isLoading, setIsLoading] = useState(false);
            const audioCtx = useRef(null);

            const resetForm = () => {
                setFormData(initialState);
                setErrors({});
                setStep('welcome');
            };

            const initAudio = () => {
                if (!audioCtx.current) {
                    audioCtx.current = new (window.AudioContext || window.webkitAudioContext)();
                }
            };

            const playSound = (type) => {
                if (!audioCtx.current || audioCtx.current.state === 'suspended') return;
                const osc = audioCtx.current.createOscillator();
                const gain = audioCtx.current.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.current.destination);
                const now = audioCtx.current.currentTime;

                if (type === 'success') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    osc.frequency.setValueAtTime(783.99, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                }
            };

            const daysOfWeek = ['א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ש'];
            
            const getDaysInMonth = (month, year) => new Date(year, month + 1, 0).getDate();
            
            const getFirstDayOfMonth = (month, year) => new Date(year, month, 1).getDay();

            const toggleDate = (dateStr, isSaturday) => {
                if (isSaturday) return;
                setFormData(prev => ({
                    ...prev,
                    availability: {
                        ...prev.availability,
                        [dateStr]: !prev.availability[dateStr]
                    }
                }));
                initAudio();
                if (audioCtx.current && audioCtx.current.state === 'suspended') audioCtx.current.resume();
                playSound('success');
            };

            const validateDetails = () => {
                const newErrors = {};
                if (!formData.firstName) newErrors.firstName = "חובה להזין שם פרטי";
                if (!formData.lastName) newErrors.lastName = "חובה להזין שם משפחה";
                if (!formData.phone || formData.phone.length < 9) newErrors.phone = "חובה להזין טלפון תקין";
                setErrors(newErrors);
                if (Object.keys(newErrors).length > 0) {
                    playSound('error');
                    return false;
                }
                return true;
            };

            const getSelectedDatesList = () => {
                return Object.keys(formData.availability)
                    .filter(date => formData.availability[date])
                    .sort()
                    .map(date => {
                        const [y, m, d] = date.split('-');
                        const dayIndex = new Date(y, parseInt(m)-1, d).getDay();
                        return {
                            formatted: `${d}/${m}/${y}`,
                            dayName: daysOfWeek[dayIndex]
                        };
                    });
            };

            const handleSubmit = async () => {
                const selectedDates = getSelectedDatesList();
                if (selectedDates.length === 0) {
                    playSound('error');
                    return;
                }

                setIsLoading(true);
                const payload = {
                    firstName: formData.firstName.trim(),
                    lastName: formData.lastName.trim(),
                    phone: formData.phone.trim(),
                    dates: selectedDates
                };

                try {
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors', 
                        cache: 'no-cache',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    });
                    
                    playSound('success');
                    setStep('success');
                } catch (error) {
                    console.error("Submission error:", error);
                    playSound('error');
                } finally {
                    setIsLoading(false);
                }
            };

            const ProgressBar = ({ currentStep }) => {
                const steps = ['details', 'july', 'august', 'summary'];
                const index = steps.indexOf(currentStep);
                if (index === -1) return null;
                return (
                    <div className="w-full h-2 bg-gray-200 rounded-full mb-6 overflow-hidden flex flex-row-reverse">
                        <div 
                            className="h-full bg-purple-500 transition-all duration-500" 
                            style={{ width: `${((index + 1) / steps.length) * 100}%` }}
                        />
                    </div>
                );
            };

            const Calendar = ({ month, monthName }) => {
                const year = 2026;
                const daysCount = getDaysInMonth(month, year);
                const firstDay = getFirstDayOfMonth(month, year);
                
                const grid = [];
                
                for (let x = 0; x < firstDay; x++) {
                    grid.push(<div key={`empty-${x}`} className="aspect-square"></div>);
                }

                for (let i = 1; i <= daysCount; i++) {
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                    const dayIndex = (firstDay + i - 1) % 7;
                    const isSaturday = dayIndex === 6;
                    const isSelected = formData.availability[dateStr];
                    
                    grid.push(
                        <button
                            key={dateStr}
                            disabled={isSaturday}
                            type="button"
                            onClick={() => toggleDate(dateStr, isSaturday)}
                            className={`relative aspect-square flex flex-col items-center justify-center rounded-lg border transition-all active:scale-95 text-xs font-bold
                                ${isSaturday ? 'bg-gray-100 cursor-not-allowed opacity-40 border-gray-200 text-gray-400' : 'bg-white border-gray-100'}
                                ${isSelected ? 'bg-green-500 border-green-600 text-white shadow-md z-10 scale-105' : 'hover:border-purple-300 text-purple-900'}
                            `}
                        >
                            <span>{i}</span>
                            {isSelected && <span className="text-[10px] absolute bottom-1">V</span>}
                            {isSaturday && <span className="text-[10px] mt-1 opacity-50">ש</span>}
                        </button>
                    );
                }

                return (
                    <div className="w-full">
                        <h2 className="text-xl font-bold text-center mb-4 text-purple-800">יומן {monthName} 2026</h2>
                        
                        <div className="grid grid-cols-7 gap-1 mb-2">
                            {daysOfWeek.map((day, idx) => (
                                <div key={idx} className="text-center text-[10px] font-bold text-purple-400 py-1">
                                    {day}
                                </div>
                            ))}
                        </div>

                        <div className="grid grid-cols-7 gap-1 bg-white/50 p-2 rounded-xl border border-purple-100 shadow-sm">
                            {grid}
                        </div>
                        
                        <div className="mt-3 flex justify-start text-[10px] text-gray-500 px-1">
                            <span className="flex items-center gap-1"><div className="w-2 h-2 bg-green-500 rounded-sm"></div> נבחר</span>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen p-2 flex flex-col items-center" dir="rtl">
                    <div className="w-full bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col border border-purple-100">
                        <div className="p-4 flex flex-col items-center border-b border-purple-50 bg-gradient-to-b from-white to-purple-50/30">
                            <img src={logoUrl} alt="טכנודע" className="h-14 object-contain mb-2" />
                            <h1 className="text-lg font-bold text-purple-900 leading-tight">זמינות מדריכים - קיץ 2026</h1>
                        </div>

                        <div className="flex-grow p-5">
                            {step === 'welcome' && (
                                <div className="flex flex-col items-center text-center space-y-6 py-10">
                                    <div className="text-5xl">🔭</div>
                                    <h2 className="text-2xl font-bold text-purple-800">קיץ מדעי בטכנודע!</h2>
                                    <p className="text-gray-600 text-sm leading-relaxed">אנא סמנו את הימים בהם תרצו לעבוד ביולי ובאוגוסט.</p>
                                    <button onClick={() => { initAudio(); setStep('details'); }} className="w-full py-4 bg-purple-600 text-white rounded-2xl font-bold text-xl shadow-lg hover:bg-purple-700 transition-all">יאללה, נתחיל</button>
                                </div>
                            )}

                            {step !== 'welcome' && step !== 'success' && <ProgressBar currentStep={step} />}

                            {step === 'details' && (
                                <div className="space-y-4">
                                    <h2 className="text-xl font-bold text-purple-800 mb-4 text-center">פרטים אישיים</h2>
                                    <div className="space-y-3">
                                        <input type="text" value={formData.firstName} onChange={(e) => setFormData({...formData, firstName: e.target.value})} className={`w-full p-4 rounded-xl border-2 outline-none transition-all ${errors.firstName ? 'border-red-400 bg-red-50' : 'border-purple-50 focus:border-purple-300 focus:bg-white bg-gray-50'}`} placeholder="שם פרטי *" />
                                        <input type="text" value={formData.lastName} onChange={(e) => setFormData({...formData, lastName: e.target.value})} className={`w-full p-4 rounded-xl border-2 outline-none transition-all ${errors.lastName ? 'border-red-400 bg-red-50' : 'border-purple-50 focus:border-purple-300 focus:bg-white bg-gray-50'}`} placeholder="שם משפחה *" />
                                        <input type="tel" value={formData.phone} onChange={(e) => setFormData({...formData, phone: e.target.value})} className={`w-full p-4 rounded-xl border-2 outline-none text-left transition-all ${errors.phone ? 'border-red-400 bg-red-50' : 'border-purple-50 focus:border-purple-300 focus:bg-white bg-gray-50'}`} placeholder="טלפון נייד *" />
                                    </div>
                                    <button onClick={() => { if(validateDetails()) setStep('july'); }} className="w-full mt-6 py-4 bg-purple-600 text-white rounded-2xl font-bold text-xl shadow-md hover:bg-purple-700">המשך ליומן יולי</button>
                                </div>
                            )}

                            {(step === 'july' || step === 'august') && (
                                <div className="space-y-6">
                                    <Calendar month={step === 'july' ? 6 : 7} monthName={step === 'july' ? "יולי" : "אוגוסט"} />
                                    <div className="flex flex-col gap-3 pt-4">
                                        <button onClick={() => setStep(step === 'july' ? 'august' : 'summary')} className="w-full py-4 bg-purple-600 text-white rounded-2xl font-bold text-xl shadow-md hover:bg-purple-700">
                                            {step === 'july' ? 'המשך לאוגוסט' : 'סיכום ושליחה'}
                                        </button>
                                        <button onClick={() => setStep(step === 'july' ? 'details' : 'july')} className="w-full text-purple-600 font-bold py-2 hover:bg-purple-50 rounded-lg transition-colors">חזרה</button>
                                    </div>
                                </div>
                            )}

                            {step === 'summary' && (
                                <div className="space-y-6">
                                    <div className="text-center">
                                        <h2 className="text-2xl font-bold text-purple-800">סיכום הבחירות</h2>
                                        <p className="text-red-500 font-bold mt-1 text-sm">📸 צלמו מסך זה למקרה של תקלה!</p>
                                    </div>
                                    
                                    <div className="bg-purple-50 p-4 rounded-2xl border border-purple-100 text-sm">
                                        <div className="flex justify-between items-center mb-3">
                                            <p className="font-bold text-purple-900">{formData.firstName} {formData.lastName}</p>
                                            <p className="text-xs text-purple-600 font-mono">{formData.phone}</p>
                                        </div>
                                        <hr className="border-purple-200 mb-3"/>
                                        <p className="font-bold mb-2 flex justify-between">
                                            <span>ימי עבודה שנבחרו:</span>
                                            <span className="bg-purple-600 text-white px-2 rounded-full">{getSelectedDatesList().length}</span>
                                        </p>
                                        <div className="max-h-60 overflow-y-auto grid grid-cols-2 gap-2 pt-1">
                                            {getSelectedDatesList().map((item, idx) => (
                                                <div key={idx} className="bg-white p-2 rounded-lg border border-purple-100 shadow-sm text-[11px] text-center font-medium">
                                                    יום {item.dayName}, {item.formatted}
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="flex flex-col gap-3">
                                        <button 
                                            disabled={isLoading}
                                            onClick={handleSubmit} 
                                            className={`w-full py-4 bg-green-500 text-white rounded-2xl font-bold text-xl shadow-lg flex items-center justify-center gap-3 transition-all ${isLoading ? 'opacity-70 cursor-not-allowed' : 'hover:bg-green-600 active:scale-95'}`}
                                        >
                                            {isLoading ? <><div className="spinner"></div> <span>שולח...</span></> : 'שלח עכשיו 🚀'}
                                        </button>
                                        <button disabled={isLoading} onClick={() => setStep('august')} className="w-full text-purple-600 font-bold py-2 hover:bg-purple-50 rounded-lg">חזרה</button>
                                    </div>
                                </div>
                            )}

                            {step === 'success' && (
                                <div className="text-center space-y-6 py-10 animate-bounce-in">
                                    <div className="text-6xl">✨</div>
                                    <h2 className="text-3xl font-bold text-green-700">איזה כיף!</h2>
                                    <p className="text-gray-600 px-4 text-sm">הפרטים שלך נקלטו במערכת טכנודע.<br/>ניפגש בקיץ!</p>
                                    <div className="pt-6">
                                        <button 
                                            type="button"
                                            onClick={resetForm} 
                                            className="text-purple-600 underline text-sm font-medium hover:text-purple-800"
                                        >
                                            מילוי טופס נוסף
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                    
                    <div className="mt-6 text-[10px] text-purple-400 font-medium">
                        © 2026 טכנודע חדרה - מערכת שיבוץ מדריכים
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
