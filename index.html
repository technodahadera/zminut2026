<style>:root{--ink:#112f53;--muted:#64788e;--navy:#092a50;--blue:#2679cc;--teal:#24abb9;--pale:#eef7fd;--lime:#84bf33;--border:#dce8f0;--shadow:0 22px 65px rgba(23,53,89,.10);--radius:24px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f4f8fc;color:var(--ink);font-family:Rubik,Arial,sans-serif;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}a{color:var(--blue)}.background-orb{position:fixed;pointer-events:none;z-index:-1;filter:blur(10px);border-radius:50%}.orb-one{background:#cdeefe;top:-180px;left:-150px;width:490px;height:490px;opacity:.48}.orb-two{background:#cbe9e0;right:-200px;bottom:-250px;width:500px;height:500px;opacity:.32}

.content-card{max-width:860px;margin:24px auto 0;padding:28px 30px}.content-wide{max-width:100%;padding:25px 28px}.step-head{display:flex;align-items:flex-start;gap:13px;margin-bottom:22px}.step-num{width:40px;height:40px;display:grid;place-items:center;flex:none;background:#ddecfa;border-radius:12px;font-weight:900;color:var(--blue)}.step-head h2,.section-heading h2{font-size:21px;margin:0 0 5px;font-weight:800}.step-head p,.section-heading p{font-size:13px;color:var(--muted);margin:0;line-height:1.7}.field-group{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:8px}.field-full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}.field input,.field textarea{width:100%;background:#f8fbfe;border:1px solid #d6e5ef;border-radius:13px;color:var(--ink);padding:14px 15px;outline:none;transition:.2s}.field textarea{resize:vertical;min-height:75px}.field input:focus,.field textarea:focus{background:#fff;border-color:#6babdf;box-shadow:0 0 0 3px rgba(31,127,216,.10)}.field .hint{font-size:11px;color:var(--muted)}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:25px;flex-wrap:wrap}.btn{border:0;padding:13px 20px;border-radius:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:9px;white-space:nowrap;text-decoration:none;transition:.17s}.btn:hover:not(:disabled){transform:translateY(-1px)}.btn-primary{color:white;background:#1266b1;box-shadow:0 7px 19px rgba(26,104,175,.16)}.btn-primary:hover{background:#0f589c}.btn-teal{background:#048a81;color:white}.btn-secondary{color:#205477;background:#eaf3f9;border:1px solid #d6e6f1}.btn-ghost{background:transparent;color:#476680}.btn-outline{background:white;color:#1266b1;border:1px solid #9fc5e8}.btn-danger{color:#bd444e;background:#fff0f1}.btn-small{font-size:12px;padding:9px 12px;border-radius:10px}.btn-block{width:100%}.muted{color:var(--muted)}.small{font-size:12px}.loading-card{margin:70px auto;max-width:400px;padding:45px;text-align:center}.loading-card h1{font-size:19px}.loader{width:32px;height:32px;border:3px solid #dce9f3;border-top-color:#2887cc;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 18px}@keyframes spin{to{transform:rotate(360deg)}}

.month-section{margin-bottom:22px}.month-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}.month-bar h3{font-weight:800;font-size:16px;margin:0}.month-bar button{background:none;border:none;color:#1e81bd;font-size:12px;font-weight:700}.date-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.date-choice{border:1.5px solid #dce7ed;background:#fff;color:#233f58;border-radius:14px;text-align:right;padding:14px 15px;display:flex;align-items:center;gap:12px;min-height:74px;transition:.17s}.date-choice:hover{border-color:#7bbdde;background:#f6fcff}.date-choice.selected{border-color:#24ad9a;background:#e7f8f3;box-shadow:0 0 0 2px rgba(36,173,154,.09)}.date-day{width:37px;text-align:center;flex:none;font-size:24px;font-weight:800;line-height:1}.date-sub{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}.date-choice.selected .date-day{color:#027567}.choice-indicator{margin-right:auto;color:#aac0cf;font-size:18px}.date-choice.selected .choice-indicator{color:#028b7d}.date-summary{background:#eff8fa;border:1px solid #d1ebea;border-radius:14px;padding:13px 17px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:4px}.date-summary strong{color:#008276}.dates-list{display:flex;flex-wrap:wrap;gap:8px}.date-tag{border:1px solid #cae5df;border-radius:9px;padding:8px 11px;font-size:12px;background:#f1faf7;color:#156f61;font-weight:600}.notice{border-radius:13px;background:#fff9ea;border:1px solid #f5e1b2;color:#87602a;padding:13px 15px;font-size:13px;line-height:1.7;margin:15px 0}.notice-error{background:#fff3f3;border-color:#f2c6c7;color:#a04247}.notice-success{background:#ecfaf4;border-color:#bee9d5;color:#167651}.summary-data{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:14px 0 22px}.summary-tile{border:1px solid #e1eaf0;background:#f8fbfd;padding:14px;border-radius:12px}.summary-tile span{font-size:11px;color:var(--muted);display ll.blank{visibility:hidden}.date-toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 14px}.date-toolbar button{font-size:11px;border-radius:8px;padding:7px 9px;background:#edf6fa;border:1px solid #d8e8f0;color:#306080;font-weight:700}.selected-box{margin-top:12px;max-height:150px;overflow:auto;display:flex;gap:6px;flex-wrap:wrap}.selected-box .date-tag{font-size:10px;padding:5px 7px}.date-range{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:13px 0}.range-weekdays{display:flex;gap:5px;justify-content:space-between}.day-toggle{flex:1;text-align:center;font-size:11px;padding:7px 0;border:1px solid #d5e3eb;background:#f7fbfd;border-radius:8px;cursor:pointer}.day-toggle input{display:none}.day-toggle:has(input:checked){background:#d7eef3;color:#07627a;border-color:#75c5da;font-weight:800}.modal-overlay{position:fixed;inset:0;background:rgba(4,24,46,.44);display:grid;place-items:center;z-index:60;padding:15px}.modal{max-height:90vh;overflow:auto;width:min(600px,100%);padding:25px}.modal h3{margin-top:0}.table-wrap{overflow:auto;border:1px solid #dce8f0;border-radius:12px}.mini-table{width:100%;border-collapse:collapse;font-size:12px}.mini-table th,.mini-table td{border-bottom:1px solid #e7edf3;text-align:right;padding:11px}.mini-table th{background:#edf6fb;font-weight:800}.empty-state{padding:35px 12px;text-align:center;color:#71869c;line-height:1.8}.toast{position:fixed;bottom:20px;left:20px;max-width:390px;border-radius:12px;padding:13px 18px;background:#102e4e;color:white;box-shadow:0 12px 30px #172d4e4d;z-index:99;opacity:0;pointer-events:none;transform:translateY(10px);transition:.25s;font-size:13px}.toast.show{opacity:1;transform:translateY(0)}.toast.error{background:#9d3541}

<script>/* Technoda instructor availability - GitHub Pages client.
   Reads public event metadata via JSONP; writes via POST + verified receipt polling.
   Admin password is sent ONLY in POST request body (never a URL or localStorage).
*/
(() => {
  'use strict';
  const app = document.getElementById('app');
  const config = { apiUrl: 'https://script.google.com/macros/s/AKfycbyjtyWSb8SoVUxfMpoeqyFvzTUrsWA3Z46upOq9DVIYzagFApPWJBzO1yCIDzQPHV-FRw/exec' }; // כתובת הפריסה העדכנית של Apps Script
  const params = new URLSearchParams(location.search);
  const isAdmin = params.get('admin') === '1';
  const eventId = params.get('event') || '';
  const weekdays = ['יום ראשון','יום שני','יום שלישי','יום רביעי','יום חמישי','יום שישי','יום שבת'];
  const shortDays = ['א','ב','ג','ד','ה','ו','ש'];
  const formatterMonth = new Intl.DateTimeFormat('he-IL', {month:'long', year:'numeric'});
  const state = {
    event:null, step:0, user:{firstName:'',lastName:'',phone:'',dates:new Set()}, busy:false,
    admin:{password:'',events:[],editing:null,dates:new Set(),currentMonth:firstOfMonth(new Date()),stats:null},
    mode:isAdmin?'admin':'event'
  };
  let toastTimer;
  const esc = v => String(v == null?'':v).replace(/[&<>"']/g, x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
  const pad = n=>String(n).padStart(2,'0');
  function firstOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1);}
  function iso(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
  function parseDate(s){const a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12);}
  function dateLabel(s){const d=parseDate(s);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;}
  function weekday(s){return weekdays[parseDate(s).getDay()];}
  function monthName(d){return formatterMonth.format(d);}
  function shortTime(value){
    const raw=String(value == null?'':value).trim();
    if(!raw)return '';
    // Google Sheets may return a long date/time string for a time-only cell.
    const time=raw.match(/(?:^|[T\s])([01]?\d|2[0-3]):([0-5]\d)(?::[0-5]\d)?(?:\.\d+)?(?:\b|$)/);
    if(time)return `${Number(time[1])}:${time[2]}`;
    // For time values which are already formatted as HH:MM.
    const compact=raw.match(/^([01]?\d|2[0-3]):([0-5]\d)$/);
    if(compact)return `${Number(compact[1])}:${compact[2]}`;
    return raw;
  }
  function sleep(t){return new Promise(r=>setTimeout(r,t));}
  function uid(){const a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');}
  function configured(){return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(String(config.apiUrl||'').trim());}
  function isValidDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;return iso(parseDate(s))===s;}
  function baseUrl(){return location.origin+location.pathname;}
  function eventUrl(id){return baseUrl()+'?event='+encodeURIComponent(id);}
  function notify(msg,error=false){let el=document.getElementById('toast');el.textContent=msg;el.className='toast show'+(error?' error':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.className='toast',5000);}
  function errorPage(title,description){app.innerHTML=`<section class="card loading-card"><div style="font-size:38px">⚠️</div><h1>${esc(title)}</h1><p class="muted">${esc(description)}</p>${isAdmin?'<a class="btn btn-secondary" href="?admin=1">חזרה לניהול</a>':''}</section>`;}
  function showBusy(text='מבצעים פעולה...'){app.innerHTML=`<div class="card loading-card"><div class="loader"></div><h1>${esc(text)}</h1><p class="muted small">אנא המתינו לסיום הפעולה</p></div>`;}
  // Public, read-only JSONP endpoint. No personal contact details are requested here.
  function jsonp(data,timeout=15000){return new Promise((resolve,reject)=>{
    if(!configured())return reject(new Error('לא הוגדר קישור חדש ל־Apps Script בתחילת קובץ index.html'));
    const cb='__tn_cb_'+uid();const s=document.createElement('script');const q=new URLSearchParams({...data,callback:cb});let done=false;
    const finish=(err,value)=>{if(done)return;done=true;clearTimeout(t);s.remove();delete window[cb];err?reject(err):resolve(value);};
    window[cb]=result=>finish(null,result);s.onerror=()=>finish(new Error('לא ניתן ליצור קשר עם שרת טכנודע'));
    const t=setTimeout(()=>finish(new Error('השרת לא השיב בזמן')),timeout);
    s.src=config.apiUrl+'?'+q.toString();document.head.appendChild(s);
  });}
  // Write endpoint: a no-cors POST is NOT considered success. Poll a private random receipt
  // stored by the server and only show success once that receipt confirms the write.
  async function send(action,payload){
    if(!configured())throw new Error('חסר קישור Apps Script ב־config.js');
    const requestId=uid();let postFailed=false;
    const sending=fetch(config.apiUrl,{method:'POST',mode:'no-cors',cache:'no-store',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,requestId,...payload})}).catch(()=>{postFailed=true;});
    await sleep(550);
    for(let i=0;i<25;i++){
      try{
        const result=await jsonp({action:'receipt',requestId},9500);
        if(result && result.ready){await sending; if(!result.ok){const failure=new Error(result.message||'הפעולה לא בוצעה');failure.backendError=true;throw failure;} return result;}
      }catch(err){if(err.backendError)throw err;}
      await sleep(i<6?600:1100);
    }
    throw new Error(postFailed?'לא הצלחנו לאמת את קליטת הנתונים. מומלץ לבדוק את הגיליון לפני שליחה מחדש.':'לא התקבל אישור שמירה מהשרת. בדקו את הגיליון לפני ניסיון נוסף.');
  }
  function header(ev){

  function bindUser(){

  function normalizePhone(p){let s=String(p).replace(/[^\d+]/g,'');if(s.startsWith('+972'))s='0'+s.slice(4);if(s.startsWith('972'))s='0'+s.slice(3);return /^05\d{8}$/.test(s)?s:null;}

  async function refreshAdmin(){const res=await send('listEvents',{password:state.admin.password});state.admin.events=res.events||[];}
  function renderAdmin(){const a=state.admin;const editing=a.editing;const open=a.events.filter(x=>x.status==='open').length;
    app.innerHTML=adminHero()+`<div class="metric-grid"><div class="metric-card"><b>${a.events.length}</b><span>אירועים במערכת</span></div><div class="metric-card"><b>${open}</b><span>אירועים פתוחים</span></div><div class="metric-card"><b>${a.events.length-open}</b><span>אירועים סגורים</span></div></div><div class="admin-columns"><aside class="card admin-side"><div class="section-heading"><h2>האירועים שלי</h2><p>קישורים, פרטי הפעילות, שינוי תאריכים ומצב המענה.</p></div><div class="event-list">${a.events.length?a.events.map(e=>`<div class="event-row"><div class="rowtop"><div><h3>${esc(e.title)}</h3><div class="sub">${e.program?esc(e.program)+' · ':''}${e.startTime?esc(e.startTime+'–'+e.endTime)+' · ':''}${e.dates.length} מועדים · ${e.count||0} מדריכים</div></div><span class="status ${e.status==='open'?'status-open':'status-closed'}">${e.status==='open'?'פעיל':'סגור'}</span></div><div class="row-actions"><button class="btn btn-small btn-secondary" data-copy="${esc(e.id)}">העתקת קישור</button><button class="btn btn-small btn-outline" data-edit="${esc(e.id)}">עריכה</button><button class="btn btn-small btn-ghost" data-stats="${esc(e.id)}">נתונים</button><button class="btn btn-small ${e.status==='open'?'btn-danger':'btn-secondary'}" data-status="${esc(e.id)}">${e.status==='open'?'סגירה':'פתיחה'}</button></div></div>`).join(''):`<div class="empty-state">עדיין לא נוצרו אירועים.<br>אפשר להתחיל בהגדרת האירוע הראשון.</div>`}</div><div class="actions"><button class="btn btn-secondary btn-block" id="new-event">+ אירוע חדש</button><button class="btn btn-ghost btn-small btn-block" id="logout">התנתקות</button></div></aside><section class="card admin-main"><div class="section-heading"><h2>${editing?'עריכת אירוע':'יצירת אירוע חדש'}</h2><p>${editing?'עדכנו את שם האירוע, התאריכים ומצב הטופס. התשובות הקודמות נשמרות.':'הגדירו שם, תכנית, שעות, פרטים ותאריכים שהמדריכים יראו.'}</p></div><form id="event-form"><div class="field"><label for="event-title">שם האירוע *</label><input id="event-title" name="title" maxlength="95" required value="${esc(editing?.title||'')}" placeholder="לדוגמה: סדנאות חנוכה תשפ״ז"></div><div class="field" style="margin-top:13px"><label for="event-description">פרטי האירוע / תיאור הפעילות</label><textarea id="event-description" name="description" maxlength="500" placeholder="מידע קצר שיוצג בטופס המדריכים">${esc(editing?.description||'')}</textarea></div><div class="field-group" style="margin-top:14px">
 <div class="field"><label for="event-program">תכנית / סוג הפעילות</label><input id="event-program" maxlength="100" value="${esc(editing?.program||'')}" placeholder="למשל: חוגי אחר הצהריים"></div>
 <div class="field"><label for="event-location">מיקום האירוע</label><input id="event-location" maxlength="120" value="${esc(editing?.location||'')}" placeholder="לדוגמה: טכנודע חדרה"></div>

 </div><div class="section-heading" style="margin:21px 0 4px"><h2>בחירת תאריכים</h2><p>לחצו על הימים בלוח, או הוסיפו טווח תאריכים לפי ימי השבוע.</p></div><div id="manager-calendar"></div><div class="field" style="margin-top:17px"><label>הוספת טווח תאריכים</label><div class="date-range"><input type="date" id="range-from" aria-label="תאריך התחלה"><input type="date" id="range-to" aria-label="תאריך סיום"></div><div class="range-weekdays">${shortDays.map((x,i)=>`<label class="day-toggle"><input type="checkbox" class="range-day" value="${i}" ${i<5?'checked':''}>${x}</label>`).join('')}</div><button type="button" class="btn btn-small btn-secondary" id="add-range" style="margin-top:12px">+ הוספת ימים מהטווח</button></div><div class="actions"><button type="button" class="btn btn-ghost btn-small" id="clear-manager">ניקוי כל התאריכים</button><strong class="small" id="manager-count"></strong></div><div id="manager-selected" class="selected-box"></div><div class="actions"><button type="submit" class="btn btn-primary" ${a.busy?'disabled':''}>${editing?'✓ שמירת השינויים':'+ יצירת אירוע והכנת גיליון'}</button>${editing?'<button type="button" class="btn btn-ghost" id="cancel-edit">ביטול עריכה</button>':''}</div></form></section></div>`;

  function renderManagerCalendar(){const a=state.admin;const d=a.currentMonth;const y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),num=new Date(y,m+1,0).getDate();let cells='';for(let i=0;i<first;i++)cells+='<span class="calendar-cell blank"></span>';
    for(let n=1;n<=num;n++){const s=iso(new Date(y,m,n));const cl=a.dates.has(s)?'selected':'';const today=s===iso(new Date())?'today':'';cells+=`<button type="button" data-calendar="${s}" aria-pressed="${a.dates.has(s)}" class="calendar-cell ${cl} ${today}">${n}</button>`;}
    document.getElementById('manager-calendar').innerHTML=`<div class="mini-calendar-header"><strong>${esc(monthName(d))}</strong><div class="mini-month-nav"><button type="button" class="icon-btn" id="month-prev" aria-label="חודש קודם">❯</button><button type="button" class="icon-btn" id="month-next" aria-label="חודש הבא">❮</button></div></div><div class="calendar-grid">${shortDays.map(x=>`<span class="calendar-weekday">${x}</span>`).join('')}${cells}</div><div class="date-toolbar"><button type="button" id="all-month">כל ימי החודש</button><button type="button" id="weekdays-month">א׳–ה׳ בחודש</button><button type="button" id="remove-month">הסרת החודש</button></div>`;
    document.getElementById('month-prev').onclick=()=>{a.currentMonth=new Date(y,m-1,1);renderManagerCalendar();};
    document.getElementById('month-next').onclick=()=>{a.currentMonth=new Date(y,m+1,1);renderManagerCalendar();};
    document.querySelectorAll('[data-calendar]').forEach(b=>b.onclick=()=>{a.dates.has(b.dataset.calendar)?a.dates.delete(b.dataset.calendar):a.dates.add(b.dataset.calendar);renderManagerCalendar();});
    document.getElementById('all-month').onclick=()=>{for(let n=1;n<=num;n++)a.dates.add(iso(new Date(y,m,n)));renderManagerCalendar();};
    document.getElementById('weekdays-month').onclick=()=>{for(let n=1;n<=num;n++){const dt=new Date(y,m,n);if(dt.getDay()<5)a.dates.add(iso(dt));}renderManagerCalendar();};
    document.getElementById('remove-month').onclick=()=>{for(let n=1;n<=num;n++)a.dates.delete(iso(new Date(y,m,n)));renderManagerCalendar();};

  }
  function bindAdmin(){const a=state.admin;
    document.getElementById('logout').onclick=()=>{a.password='';a.events=[];renderAdminLogin();};
    document.getElementById('new-event').onclick=()=>{a.editing=null;a.dates=new Set();a.currentMonth=firstOfMonth(new Date());renderAdmin();};
    document.getElementById('cancel-edit')?.addEventListener('click',()=>{a.editing=null;a.dates=new Set();renderAdmin();});

    document.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{const e=a.events.find(x=>x.id===b.dataset.status);if(!e||a.busy)return;a.busy=true;notify('מעדכנים מצב אירוע...');try{await send('setStatus',{password:a.password,eventId:e.id,status:e.status==='open'?'closed':'open'});await refreshAdmin();notify('מצב האירוע עודכן');}catch(err){notify(err.message,true);}finally{a.busy=false;renderAdmin();}});
    document.querySelectorAll('[data-stats]').forEach(b=>b.onclick=async()=>{const e=a.events.find(x=>x.id===b.dataset.stats);if(!e||a.busy)return;a.busy=true;notify('טוענים את נתוני האירוע...');try{const r=await send('getStats',{password:a.password,eventId:e.id});showStats(e,r);}catch(err){notify(err.message,true);}finally{a.busy=false;}});
    document.getElementById('event-form').addEventListener('submit',async evt=>{evt.preventDefault();if(a.busy)return;const title=document.getElementById('event-title').value.trim();const description=document.getElementById('event-description').value.trim();const program=document.getElementById('event-program').value.trim();const location=document.getElementById('event-location').value.trim();const startTime=document.getElementById('event-start').value;const endTime=document.getElementById('event-end').value;const notes=document.getElementById('event-notes').value.trim();const dates=[...a.dates].sort();if(!title||dates.length===0){notify('יש להזין שם אירוע ולבחור לפחות תאריך אחד.',true);return;}if(dates.length>180){notify('אפשר להגדיר עד 180 מועדים באירוע.',true);return;}if((startTime&&!endTime)||(!startTime&&endTime)||(startTime&&endTime&&startTime>=endTime)){notify('יש להזין שעות התחלה וסיום תקינות.',true);return;}a.busy=true;const editId=a.editing?.id||uid();const action=a.editing?'updateEvent':'createEvent';notify('שומרים את האירוע בגיליון...');try{await send(action,{password:a.password,eventId:editId,title,description,dates,program,location,startTime,endTime,notes});await refreshAdmin();a.editing=null;a.dates=new Set();renderAdmin();notify('האירוע נשמר. אפשר להעתיק את הקישור למדריכים.');}catch(err){notify(err.message,true);renderAdmin();}finally{a.busy=false;}});
  }
  function copy(text){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>notify('הקישור הועתק ללוח')).catch(()=>manualCopy(text));}else manualCopy(text);}
  function manualCopy(text){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();notify('הקישור הועתק ללוח');}
  function showStats(event,result){const rows=result.instructors||[];const counts=result.daily||[];const overlay=document.createElement('div');overlay.className='modal-overlay';overlay.innerHTML=`<div class="card modal" role="dialog" aria-modal="true" aria-label="נתוני אירוע"><div class="section-heading"><h2>נתוני זמינות: ${esc(event.title)}</h2><p>${rows.length} מדריכים השיבו</p></div><div class="table-wrap"><table class="mini-table"><thead><tr><th>תאריך</th><th>מספר מדריכים זמינים</th></tr></thead><tbody>${counts.map(r=>`<tr><td>${esc(dateLabel(r.date))}</td><td>${Number(r.count)||0}</td></tr>`).join('')}</tbody></table></div><div class="actions"><button class="btn btn-primary btn-small" id="stats-export">ייצוא CSV</button><button class="btn btn-secondary btn-small" id="stats-close">סגירה</button></div></div>`;document.body.appendChild(overlay);const close=()=>overlay.remove();overlay.addEventListener('click',e=>{if(e.target===overlay)close();});overlay.querySelector('#stats-close').onclick=close;overlay.querySelector('#stats-export').onclick=()=>{const matrix=[['שם פרטי','שם משפחה','טלפון','תאריכי זמינות'],...rows.map(r=>[r.firstName,r.lastName,r.phone,(r.dates||[]).map(dateLabel).join(', ')])];const csv='\uFEFF'+matrix.map(line=>line.map(s=>{let v=String(s??'');if(/^[=+@-]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';}).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const anchor=document.createElement('a');anchor.href=url;anchor.download=`זמינות-${event.title.replace(/[\\/:*?"<>|]/g,'-')}.csv`;anchor.click();setTimeout(()=>URL.revokeObjectURL(url),2000);};}
  async function start(){document.getElementById('footer-admin').innerHTML=isAdmin?'ניהול אירועים':`<a href="?admin=1">כניסת מנהל</a>`;
    if(!configured()){errorPage('נדרשת הגדרה חד־פעמית','יש להדביק את קישור הפריסה החדשה של Google Apps Script בתחילת קובץ index.html. הוראות מצורפות בתיקיית האתר.');return;}
    if(isAdmin){renderAdminLogin();return;}
    if(!eventId){app.innerHTML=`<section class="hero"><span class="eyebrow">טכנודע חדרה</span><h1>זמינות מדריכים לאירועים</h1><p>למדריכים: יש לפתוח את הקישור הייחודי שנשלח אליכם עבור האירוע.</p></section><section class="card content-card" style="text-align:center"><h2>ניהול אירועים</h2><p class="muted">ליצירה ועדכון אירועים, מועדים, שעות עבודה והערות</p><a class="btn btn-primary" href="?admin=1">כניסת מנהל</a></section>`;return;}
    try{const response=await jsonp({action:'event',eventId});if(!response.ok)throw new Error(response.message||'האירוע לא נמצא');const ev=response.event;if(!Array.isArray(ev.dates)||!ev.dates.length)throw new Error('לא הוגדרו תאריכים לאירוע');state.event=ev;renderUser();}catch(err){errorPage('לא ניתן לטעון אירוע',err.message);}
  }
  start();
})();
</script>
</body></html>
